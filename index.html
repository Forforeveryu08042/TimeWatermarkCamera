<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0a">
  <title>水印相机</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- ========== 取景页 ========== -->
  <div id="camera-page" class="page active">
    <div id="viewfinder">
      <video id="video" autoplay playsinline></video>

      <!-- 左上：水印预览 -->
      <div id="wm-preview">
        <div class="wm-title" id="wm-title-preview">工程记录</div>
        <div class="wm-row"><span>拍摄时间:</span><span id="wm-time-preview">--</span></div>
        <div class="wm-row"><span>天气:</span><span id="wm-weather-preview">获取中</span></div>
        <div class="wm-row"><span>地点:</span><span id="wm-loc-preview">等待GPS定位...</span></div>
      </div>

      <!-- GPS状态 -->
      <div id="gps-status">
        <span class="gps-dot" id="gps-dot"></span>
        <span id="gps-text">等待GPS</span>
      </div>

      <!-- GPS引导 -->
      <div id="gps-guide" class="hidden">
        <div class="guide-card">
          <div class="guide-icon">📍</div>
          <div class="guide-title">需要精确位置</div>
          <div class="guide-desc">请授权GPS定位以获取街道级地址<br>室外定位更精准</div>
          <button id="gps-btn">启用位置权限</button>
        </div>
      </div>

      <!-- 标题编辑 -->
      <div id="title-edit" class="hidden">
        <div class="guide-card">
          <div class="guide-title">修改标题</div>
          <input id="title-input" type="text" maxlength="12" value="工程记录" placeholder="输入标题">
          <button id="title-save">确定</button>
        </div>
      </div>
    </div>

    <!-- 底部 -->
    <div id="controls">
      <button id="btn-title" class="ctrl-side" title="修改标题">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>

      <button id="btn-capture">
        <span class="btn-inner"></span>
      </button>

      <button id="btn-switch" class="ctrl-side">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round"><path d="M19 7h-7a5 5 0 0 0-5 5v0a5 5 0 0 0 5 5h7"/><path d="m16 4 3 3-3 3"/></svg>
      </button>
    </div>
  </div>

  <!-- ========== 结果页 ========== -->
  <div id="result-page" class="page">
    <div id="result-wrap">
      <canvas id="result-canvas"></canvas>
    </div>
    <div id="result-actions">
      <button id="btn-retake" class="btn-outline">重拍</button>
      <button id="btn-save" class="btn-solid">保存到相册</button>
    </div>
  </div>

</div>

<canvas id="preview-canvas" style="display:none"></canvas>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
